<!-- custom-modal.html -->
<div class="modal-overlay" *ngIf="visible" [ngClass]="{ 'fade-in': !fadeOut, 'fade-out': fadeOut }">
  <div class="modal-container" [ngClass]="type" (click)="$event.stopPropagation()">
    <button class="close-btn" (click)="closeModal($event)">×</button>

    <div class="icon" [ngClass]="type">
      <span *ngIf="type === 'success'">✔</span>
      <span *ngIf="type === 'error'">✖</span>
      <span *ngIf="type === 'warning'">⏱</span>
    </div>

    <h4>{{ title }}</h4>
    <p [innerHTML]="message"></p>

    <button class="action-btn" [ngClass]="type" (click)="confirmAction($event)">
      {{ buttonText }}
    </button>
  </div>
</div>
