<app-header></app-header>

<app-contract-modal
  [(visible)]="showContractModal"
  (saved)="onContractSaved($event)"
></app-contract-modal>

<app-custom-modal
  [visible]="showCustomModal"
  title="{{ customModalTitle }}"
  message="{{ customModalMessage }}"
  type="{{ customModalType }}"
  buttonText="{{ customModalButtonText }}"
  (confirmed)="onRetry()"
  (closed)="onClose()"
></app-custom-modal>

<app-no-contracts-modal
  [visible]="showNoContracts"
  (close)="onNoContractsClosed()"
  (viewInvoices)="onViewContracts()"
  (registerInvoices)="onRegisterInvoices()"
></app-no-contracts-modal>

<div class="home-container">
  <div class="logout"></div>
  <div class="home-box">
    <div class="welcome">Hola, {{ user?.name }} {{ user?.lastname }}</div>
    <p>Bienvenido a la plataforma de descarga de factura de la Tasa de Seguridad</p>
  </div>

  <div class="home-items">
     <!-- ***Se comenta mientras se implementa funcionalidad***
    <div class="item">
      <img src="/images/notificaciones.png" alt="Icono Pagos" />
    </div>
    <div class="item">
      <img src="/images/historial de pagos.png" alt="Icono Pagos" />
    </div>
  
    <div class="item">
      <a routerLink="/pending-payments">
        <img src="/images/facturas.png" alt="Icono Pagos" />
      </a>
    </div>
    -->
    <div class="item">
      <a routerLink="/view-invoices">
        <img src="/images/descargar factura.png" alt="Icono Pagos" />
      </a>
    </div>
    <div class="item" (click)="openContractModal(); $event.preventDefault()">
      <img src="/images/inscribir-contratos.png" alt="Inscribir contratos" />
    </div>
    <!-- Opciones de administrador (correos en ADMIN_EMAIL del backend) -->
    <ng-container *ngIf="isAdmin">
      <a class="item admin-item" routerLink="/admin/facturas">
        <span class="admin-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
            <path d="M14 3v5h5" />
            <path d="M12 11v6" />
            <path d="m9 14 3 3 3-3" />
          </svg>
        </span>
        <span class="admin-label">Descargar facturas admin</span>
      </a>
      <a class="item admin-item" routerLink="/desbloquear">
        <span class="admin-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="5" y="11" width="14" height="10" rx="2" />
            <path d="M8 11V7a4 4 0 0 1 7.5-2" />
            <path d="M12 15v2" />
          </svg>
        </span>
        <span class="admin-label">Desbloquear contratos</span>
      </a>
    </ng-container>
    <!-- ***Se comenta mientras se implementa funcionalidad***  
    <div class="item">
      <a routerLink="/manage-contracts">
        <img src="/images/ver-contratos.png" alt="Icono Pagos" />
      </a>
    </div>
    -->
  </div>
</div>
